name: CI

on:
    push:
        branches:
            - master
        tags-ignore:
            - '**'
    pull_request:
        branches:
            - '**'

jobs:
    build:
        name: Build (${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [16.x, 18.x, 20.x, 22.x, 24.x, 26.x]
                include:
                    # End-of-life Node.js lines: the linters, nyc and jsdom >= 27 no longer run there,
                    # so these only build and run the test suite.
                    - node-version: 16.x
                      legacy: true
                    - node-version: 18.x
                      legacy: true
        steps:
            - name: Set default Git branch name
              run: git config --global init.defaultBranch master
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - if: matrix.legacy
              name: Use jsdom 26 (last release supporting Node.js < 20)
              run: npm install --no-save --no-audit --no-fund jsdom@26.1.0
            - if: github.event_name == 'pull_request' && !matrix.legacy
              name: Lint commit messages
              run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
            - if: '!matrix.legacy'
              run: npm run format:check
            - if: '!matrix.legacy'
              run: npm run lint
            - run: npm run build
            - if: matrix.legacy
              run: npm test
            - if: '!matrix.legacy'
              run: npm run coverage
            - if: matrix.node-version == '24.x'
              uses: actions/upload-artifact@v7
              with:
                  name: Code coverage
                  path: coverage/
            - if: matrix.node-version == '24.x'
              run: npm run docs
            - if: matrix.node-version == '24.x'
              uses: actions/upload-artifact@v7
              with:
                  name: Documentation
                  path: docs/

    publish:
        name: 'Publish'
        needs: build
        runs-on: ubuntu-latest
        environment: npm_publish
        if: github.ref == 'refs/heads/master'
        steps:
            - name: Set default Git branch name
              run: git config --global init.defaultBranch master
            - uses: actions/download-artifact@v8
              with:
                  name: Documentation
                  path: docs/
            - name: Deploy Docs
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: 'npm'
            - run: npm ci
            - name: Publish new version
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx --yes -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@8.0.0 semantic-release
